<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도 API 수정 테스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .test-container { margin: 20px 0; }
        .debug-info { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .test-map { border: 2px solid #007bff; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>카카오 지도 API 수정 테스트</h1>
        
        <div class="test-container">
            <h3>1. API 키 상태 확인</h3>
            <div id="api-status" class="debug-info">
                <i class="fas fa-spinner fa-spin"></i> 확인 중...
            </div>
        </div>
        
        <div class="test-container">
            <h3>2. 지도 매니저 디버그 정보</h3>
            <div id="debug-info" class="debug-info">
                <i class="fas fa-spinner fa-spin"></i> 로딩 중...
            </div>
        </div>
        
        <div class="test-container">
            <h3>3. 테스트 지도</h3>
            <button class="btn btn-primary" onclick="runMapTest()">
                <i class="fas fa-map"></i> 지도 테스트 실행
            </button>
            <div id="test-map" class="test-map" style="width: 400px; height: 300px; display: none;">
                <div class="text-center py-5">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>지도 로딩 중...</p>
                </div>
            </div>
        </div>
        
        <div class="test-container">
            <h3>4. 상세 페이지 지도 테스트</h3>
            <button class="btn btn-success" onclick="runDetailMapTest()">
                <i class="fas fa-map-marked-alt"></i> 상세 페이지 지도 테스트
            </button>
            <div id="heritage-map" class="test-map" style="width: 300px; height: 200px; display: none;">
                <div class="text-center py-4">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>지도 로딩 중...</p>
                </div>
            </div>
        </div>
        
        <div class="test-container">
            <h3>5. 로그 출력</h3>
            <div id="log-output" class="debug-info" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
                <!-- 로그가 여기에 표시됩니다 -->
            </div>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <script src="js/config.js"></script>
    <script src="js/map-manager-simple.js"></script>
    
    <script>
        // 로그 출력 함수
        function log(message) {
            const logOutput = document.getElementById('log-output');
            const timestamp = new Date().toLocaleTimeString();
            logOutput.innerHTML += `[${timestamp}] ${message}<br>`;
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(message);
        }
        
        // API 키 상태 확인
        function checkApiStatus() {
            const statusDiv = document.getElementById('api-status');
            const status = API_KEY_STATUS;
            
            let statusHtml = `
                <h5>API 키 상태</h5>
                <p><strong>유효성:</strong> ${status.isValid ? '✅ 유효' : '❌ 무효'}</p>
                <p><strong>도메인:</strong> ${status.domainValid ? '✅ 허용' : '❌ 제한'}</p>
                <p><strong>출처:</strong> ${status.source}</p>
                <p><strong>API 키:</strong> ${KAKAO_MAP_API_KEY ? KAKAO_MAP_API_KEY.substring(0, 8) + '...' : 'undefined'}</p>
            `;
            
            if (!status.isValid) {
                statusHtml += '<div class="alert alert-danger mt-2">API 키가 유효하지 않습니다!</div>';
            }
            
            statusDiv.innerHTML = statusHtml;
        }
        
        // 디버그 정보 업데이트
        function updateDebugInfo() {
            const debugDiv = document.getElementById('debug-info');
            const debugInfo = mapManager.getDebugInfo();
            
            let debugHtml = `
                <h5>지도 매니저 상태</h5>
                <p><strong>스크립트 로드됨:</strong> ${debugInfo.scriptLoaded ? '✅' : '❌'}</p>
                <p><strong>로딩 중:</strong> ${debugInfo.scriptLoading ? '⏳' : '❌'}</p>
                <p><strong>현재 지도:</strong> ${debugInfo.currentMap ? '✅' : '❌'}</p>
                <p><strong>Kakao 정의됨:</strong> ${debugInfo.kakaoDefined ? '✅' : '❌'}</p>
                <p><strong>Kakao Maps 정의됨:</strong> ${debugInfo.kakaoMapsDefined ? '✅' : '❌'}</p>
                <p><strong>API 준비됨:</strong> ${debugInfo.isKakaoMapsReady ? '✅' : '❌'}</p>
                <h6>클래스 상태:</h6>
                <ul>
                    <li>LatLng: ${debugInfo.classes.LatLng ? '✅' : '❌'}</li>
                    <li>Map: ${debugInfo.classes.Map ? '✅' : '❌'}</li>
                    <li>Marker: ${debugInfo.classes.Marker ? '✅' : '❌'}</li>
                    <li>InfoWindow: ${debugInfo.classes.InfoWindow ? '✅' : '❌'}</li>
                </ul>
            `;
            
            debugDiv.innerHTML = debugHtml;
        }
        
        // 지도 테스트 실행
        async function runMapTest() {
            log('🧪 지도 테스트 시작');
            const testMapDiv = document.getElementById('test-map');
            testMapDiv.style.display = 'block';
            
            try {
                await mapManager.testMap('test-map');
                log('✅ 지도 테스트 완료');
            } catch (error) {
                log('❌ 지도 테스트 실패: ' + error.message);
            }
            
            updateDebugInfo();
        }
        
        // 상세 페이지 지도 테스트
        async function runDetailMapTest() {
            log('🗺️ 상세 페이지 지도 테스트 시작');
            const heritageMapDiv = document.getElementById('heritage-map');
            heritageMapDiv.style.display = 'block';
            
            // 테스트 좌표 (서울 부암동 백석동천)
            const testCoords = { lat: 37.5955, lng: 126.9665 };
            
            try {
                await mapManager.showMap('heritage-map', testCoords, '서울 부암동 백석동천');
                log('✅ 상세 페이지 지도 테스트 완료');
            } catch (error) {
                log('❌ 상세 페이지 지도 테스트 실패: ' + error.message);
            }
            
            updateDebugInfo();
        }
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 페이지 로드 완료');
            checkApiStatus();
            updateDebugInfo();
            
            // 1초마다 디버그 정보 업데이트
            setInterval(updateDebugInfo, 1000);
        });
        
        // 콘솔 로그를 페이지에도 표시
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            log('LOG: ' + args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            log('ERROR: ' + args.join(' '));
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            log('WARN: ' + args.join(' '));
        };
    </script>
</body>
</html>
